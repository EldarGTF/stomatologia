server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stomatologia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stomatologia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    expiration-hours: 8
  demo-data: ${DEMO_DATA:true}
  # Лимиты публичного API сайта онлайн-записи с одного IP-адреса
  public-api:
    reads-per-minute: 120
    writes-per-hour: 10

management:
  endpoints:
    web:
      exposure:
        include: health
